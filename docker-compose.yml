# Local development database.
#
# Understory targets CognoDB Cloud in production. CognoDB speaks openCypher over
# Bolt 5.x and is driven by the official Neo4j driver, so a local Neo4j 5
# container is a faithful stand-in for offline development - the application
# code, the Cypher, and the driver calls are byte-for-byte identical. The only
# thing that changes between local and production is the three NEO4J_* values
# in `.env.local`.
#
#   docker compose up -d      # start
#   docker compose down -v    # stop and delete the volume
#
# Browser UI: http://localhost:7474  (user: neo4j / pass: understory-dev)

services:
  graph:
    image: neo4j:5.26-community
    container_name: understory-graph
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/understory-dev
      # Deliberately constrained to approximate the CognoDB free (c0) tier
      # (0.5 vCPU / 256 MB RAM) so we catch memory-hungry queries locally.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - graph-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  graph-data:
